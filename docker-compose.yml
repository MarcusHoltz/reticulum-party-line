# reticulum-party-line compose
#
# Usage:
#   docker compose build
#   docker compose run --rm partyline                   # interactive menu
#   docker compose run --rm partyline relay              # relay mode
#   docker compose run --rm partyline call <dest-hash>   # call a relay
#
# Additional services behind profiles:
#   docker compose --profile shell run --rm shell        # debug shell
#   docker compose --profile reflector up -d reflector   # headless relay daemon

x-partyline-base: &partyline-base
  build:
    context: .
  image: reticulum-party-line:dev
  # shm_size gotcha (PLAN.md 20.7): /dev/shm defaults to 64MB in Docker.
  # A 120s wav at 48kHz/16-bit/mono is ~11.5MB and the playback queue can hold
  # several; RUNTIME_DIR also lives here. 512MB is comfortably above the worst
  # realistic case.
  shm_size: "512m"
  # RUNTIME_DIR (section 20.6): tmpfs holding audio/, run/, pids/, and the RNS
  # storage/ subdir. Nothing here survives a container restart, which is the
  # ephemeral rule (section 19.1).
  tmpfs:
    - /dev/shm:size=512m,mode=1777
  environment:
    DATA_DIR: /app/data
    RUNTIME_DIR: /dev/shm/partyline
    REFLECTOR_PORT: "4242"
    RNS_LISTEN_HOST: "0.0.0.0"
    # rns-party-line.sh reads the shared secret from this path when set. The file
    # is optional at first boot; the interactive setup writes it.
    SHARED_SECRET_FILE: /run/secrets/shared_secret.txt
    # Non-interactive containers need TERM for `clear` and status redraws.
    TERM: "xterm"
    # Audio: talk to the HOST's sound server over the socket bind-mounted
    # below, which is the only route that reaches real speakers. A container
    # has no sound hardware of its own; a local PulseAudio instance can only
    # ever play into a null sink (see docker-entrypoint.sh). Set UID=$(id -u)
    # in .env if your host uid is not 1000.
    PULSE_SERVER: "unix:/run/user/${UID:-1000}/pulse/native"
    XDG_RUNTIME_DIR: "/run/user/${UID:-1000}"
  volumes:
    # DATA_DIR (persistent): identity, shared_secret, config. Everything else
    # is ephemeral by construction.
    - ./data:/app/data
    - ./secrets:/run/secrets:ro
    # Host PulseAudio / pipewire-pulse socket directory. Works for both
    # servers: pipewire-pulse exposes the same native socket. Without this
    # the container is deaf and mute no matter what rns-party-line.sh does.
    - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse:/run/user/${UID:-1000}/pulse
    # ALSA-direct fallback for bare-ALSA hosts with no sound server. Commented
    # out because a host with no /dev/snd (headless server, most VMs) makes
    # `docker compose up` fail outright on a missing device.
    # devices:
    #   - /dev/snd:/dev/snd
  # SELinux (Fedora/RHEL): run the container unconfined so it may write the
  # host's PulseAudio socket (labelled user_tmp_t). Without this, container_t
  # is denied and paplay/parecord fail silently, which looks exactly like
  # "audio is broken". Ignored on non-SELinux hosts (Debian, Arch, macOS).
  security_opt:
    - label:disable
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
  working_dir: /app
  stdin_open: true
  tty: true

services:

  # Interactive partyline (menu, call, relay). Matches the workflow used by
  # tor-party-line and i2p-party-line:
  #   docker compose build
  #   docker compose run --rm partyline
  #   docker compose run --rm partyline relay
  #   docker compose run --rm partyline call <dest-hash>
  #
  # entrypoint wraps docker-entrypoint.sh (audio setup) then rns-party-line.sh,
  # so `docker compose run --rm partyline relay` passes "relay" as an arg
  # to rns-party-line.sh rather than replacing the whole command.
  partyline:
    <<: *partyline-base
    container_name: reticulum-party-line
    entrypoint: ["docker-entrypoint.sh", "bash", "/app/src/rns-party-line.sh"]
    command: []

  # Interactive shell for RNS bring-up and measurement work.
  shell:
    <<: *partyline-base
    profiles: ["shell"]
    command: ["bash"]

  # Explicit reflector role. Publishes no host ports: clients reach it over
  # the compose network at hostname `reflector`. Runs rns-party-line.sh in relay
  # subcommand so `up -d reflector` actually starts the fanout.
  reflector:
    <<: *partyline-base
    profiles: ["reflector"]
    hostname: reflector
    stdin_open: false
    tty: false
    restart: unless-stopped
    command: ["bash", "/app/src/rns-party-line.sh", "relay"]
