# =========================================================================
# Build & Publish
# =========================================================================
#
# QUICK START
#   Actions > "Release" > Run workflow.
#   Fill in the version (e.g. "1.0.0", no "v" prefix).
#   Check which registries to push to, then click "Run workflow".
#
# DRY RUN (build without pushing)
#   Check "Build only (dry run)" to build the image without pushing
#   to any registry. No secrets needed. Works on forks.
#
# -------------------------------------------------------------------------
# REGISTRIES
# -------------------------------------------------------------------------
#
# GHCR (GitHub Container Registry)
#   Enabled by default. No setup needed.
#   Authenticates automatically via GITHUB_TOKEN.
#   Images land at: ghcr.io/<your-github-username>/reticulum-party-line
#   Distrobox image: ghcr.io/<your-github-username>/reticulum-party-line-box
#
# Docker Hub
#   Optional. Requires two repository secrets:
#     Settings > Secrets and variables > Actions > New repository secret
#
#     DOCKERHUB_USERNAME   your Docker Hub username
#     DOCKERHUB_TOKEN      a Personal Access Token (NOT your password)
#                          Create one: hub.docker.com > Account Settings >
#                          Security > Access Tokens
#
#   Images land at: <DOCKERHUB_USERNAME>/reticulum-party-line
#   Distrobox image: <DOCKERHUB_USERNAME>/reticulum-party-line-box
#
# GitLab Container Registry
#   NOT handled here. Use .gitlab-ci.yml for GitLab CR pushes.
#   Each CI platform pushes only to its own native registry.
#
# -------------------------------------------------------------------------
# FOR FORKS / NEW USERS
# -------------------------------------------------------------------------
# 1. Dry run works immediately. No secrets, no config.
# 2. GHCR works immediately. GITHUB_TOKEN is automatic.
# 3. Docker Hub: add your own DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
#    secrets. The workflow defaults to your GitHub username as the
#    Docker Hub namespace (override DH_NS below if yours differs).
# 4. Audit + smoke test run first. Images only push if both pass.
#
# =========================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0, no v prefix)"
        required: true
        type: string
      dry_run:
        description: "Build only (dry run, no push)"
        type: boolean
        default: false
      push_dockerhub:
        description: "Push to Docker Hub (needs DOCKERHUB secrets)"
        type: boolean
        default: true
      push_ghcr:
        description: "Push to GitHub Container Registry"
        type: boolean
        default: true
      # -- Self-hosted registry (uncomment when ready) ---------------------
      # push_selfhosted:
      #   description: "Push to self-hosted registry"
      #   type: boolean
      #   default: false
      # selfhosted_registry:
      #   description: "Self-hosted registry URL (e.g. registry.example.com)"
      #   type: string
      #   default: ""

env:
  IMAGE_NAME: reticulum-party-line
  DH_NS: ${{ github.repository_owner }}
  GHCR_NS: ghcr.io/${{ github.repository_owner }}

jobs:
  audit-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit Dockerfile pins
        run: ./docker/hooks/audit-pins.sh

      - name: Job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ```
            ____            _         _ _
           |  _ \ __ _ _ __| |_ _   _| (_)_ __   ___
           | |_) / _` | '__| __| | | | | | '_ \ / _ \
           |  __/ (_| | |  | |_| |_| | | | | | |  __/
           |_|   \__,_|_|   \__|\__, |_|_|_| |_|\___|
                                 |___/
            ____      _   _            _
           |  _ \ ___| |_(_) ___ _   _| |_   _ _ __ ___
           | |_) / _ \ __| |/ __| | | | | | | | '_ ` _ \
           |  _ <  __/ |_| | (__| |_| | | |_| | | | | | |
           |_| \_\___|\__|_|\___|\__,_|_|\__,_|_| |_| |_|
          ```
          **Job:** `audit-pins`
          EOF

  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/share/powershell /usr/local/share/chromium

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: reticulum-party-line:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash reticulum-party-line:ci -c '
            set -e
            python3 -c "import RNS; print(RNS)"
            command -v socat
            command -v openssl
            echo "smoke-ok"
          '

      - name: Build box image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.distrobox
          load: true
          tags: reticulum-party-line-box:ci
          cache-from: type=gha,scope=box
          cache-to: type=gha,mode=max,scope=box

      - name: Box smoke test
        run: |
          docker run --rm reticulum-party-line-box:ci bash -c '
            set -e
            command -v rns-party-line.sh
            python3 -c "import RNS; print(RNS)"
            command -v socat
            command -v openssl
            command -v pcm_rms
            echo "box-smoke-ok"
          '

      - name: Job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ```
            ____            _         _ _
           |  _ \ __ _ _ __| |_ _   _| (_)_ __   ___
           | |_) / _` | '__| __| | | | | | '_ \ / _ \
           |  __/ (_| | |  | |_| |_| | | | | | |  __/
           |_|   \__,_|_|   \__|\__, |_|_|_| |_|\___|
                                 |___/
            ____      _   _            _
           |  _ \ ___| |_(_) ___ _   _| |_   _ _ __ ___
           | |_) / _ \ __| |/ __| | | | | | | | '_ ` _ \
           |  _ <  __/ |_| | (__| |_| | | |_| | | | | | |
           |_| \_\___|\__|_|\___|\__,_|_|\__,_|_| |_| |_|
          ```
          **Job:** `build-and-smoke`
          EOF

  push-image:
    needs: [build-and-smoke, audit-pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /usr/local/share/powershell /usr/local/share/chromium

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        if: inputs.push_dockerhub && !inputs.dry_run
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: inputs.push_ghcr && !inputs.dry_run
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- Self-hosted login (uncomment when ready) ------------------------
      # - name: Log in to self-hosted registry
      #   if: inputs.push_selfhosted && inputs.selfhosted_registry != '' && !inputs.dry_run
      #   uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      #   with:
      #     registry: ${{ inputs.selfhosted_registry }}
      #     username: ${{ secrets.SELFHOSTED_USERNAME }}
      #     password: ${{ secrets.SELFHOSTED_TOKEN }}

      - name: Assemble tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          PUSH_DH: ${{ inputs.push_dockerhub }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          DRY_RUN: ${{ inputs.dry_run }}
          # -- Self-hosted env (uncomment when ready) ----------------------
          # PUSH_SELF: ${{ inputs.push_selfhosted }}
          # SELF_REG: ${{ inputs.selfhosted_registry }}
        run: |
          DH_NS=$(echo "$DH_NS" | tr '[:upper:]' '[:lower:]')
          GHCR_NS=$(echo "$GHCR_NS" | tr '[:upper:]' '[:lower:]')
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: building ${IMAGE_NAME} without pushing"
            echo "tags=${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAGS=""
          if [ "$PUSH_DH" = "true" ]; then
            TAGS="${TAGS}${DH_NS}/${IMAGE_NAME}:latest
          ${DH_NS}/${IMAGE_NAME}:${VERSION}
          "
          fi
          if [ "$PUSH_GHCR" = "true" ]; then
            TAGS="${TAGS}${GHCR_NS}/${IMAGE_NAME}:latest
          ${GHCR_NS}/${IMAGE_NAME}:${VERSION}
          "
          fi
          # -- Self-hosted tags (uncomment when ready) ---------------------
          # if [ "$PUSH_SELF" = "true" ] && [ -n "$SELF_REG" ]; then
          #   TAGS="${TAGS}${SELF_REG}/${IMAGE_NAME}:latest
          # ${SELF_REG}/${IMAGE_NAME}:${VERSION}
          # "
          # fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assemble box tags
        id: box-tags
        env:
          VERSION: ${{ inputs.version }}
          PUSH_DH: ${{ inputs.push_dockerhub }}
          PUSH_GHCR: ${{ inputs.push_ghcr }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          BOX_NAME="${IMAGE_NAME}-box"
          DH_NS=$(echo "$DH_NS" | tr '[:upper:]' '[:lower:]')
          GHCR_NS=$(echo "$GHCR_NS" | tr '[:upper:]' '[:lower:]')
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: building ${BOX_NAME} without pushing"
            echo "tags=${BOX_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAGS=""
          if [ "$PUSH_DH" = "true" ]; then
            TAGS="${TAGS}${DH_NS}/${BOX_NAME}:latest
          ${DH_NS}/${BOX_NAME}:${VERSION}
          "
          fi
          if [ "$PUSH_GHCR" = "true" ]; then
            TAGS="${TAGS}${GHCR_NS}/${BOX_NAME}:latest
          ${GHCR_NS}/${BOX_NAME}:${VERSION}
          "
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push box image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.distrobox
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.box-tags.outputs.tags }}
          cache-from: type=gha,scope=box
          cache-to: type=gha,mode=max,scope=box

      - name: Job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ```
            ____            _         _ _
           |  _ \ __ _ _ __| |_ _   _| (_)_ __   ___
           | |_) / _` | '__| __| | | | | | '_ \ / _ \
           |  __/ (_| | |  | |_| |_| | | | | | |  __/
           |_|   \__,_|_|   \__|\__, |_|_|_| |_|\___|
                                 |___/
            ____      _   _            _
           |  _ \ ___| |_(_) ___ _   _| |_   _ _ __ ___
           | |_) / _ \ __| |/ __| | | | | | | | '_ ` _ \
           |  _ <  __/ |_| | (__| |_| | | |_| | | | | | |
           |_| \_\___|\__|_|\___|\__,_|_|\__,_|_| |_| |_|
          ```
          **Job:** `push-image`
          EOF
